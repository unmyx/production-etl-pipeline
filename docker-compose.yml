services:
  db:
    image: postgres:16
    container_name: production_etl_postgres
    environment:
      POSTGRES_DB: etl_demo
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d etl_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
